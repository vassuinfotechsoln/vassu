version: "3.9"

services:

  mongo:
    image: mongo:7
    container_name: vassu-mongo
    restart: always
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: vassu-backend
    restart: always
    ports:
      - "4001:4001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: vassu-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=https://vassutalks.vassuinfotech.com
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_SECRET=a4di+C6+4Mn/QMR9QlTNJeqTMSBnwy2PEpdbmzWf1n0=
    depends_on:
      - backend

volumes:
  mongo-data: